# Tests the logic, builds the ESP32 firmware and, for a tag v*, publishes
# a release with the default images (no remote server, sheet-1 divider).
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  ESPUP_VERSION: "0.19.0"
  ESP_TOOLCHAIN: "1.97.0.0"
  ESPFLASH_VERSION: "4.6.0"
  LDPROXY_VERSION: "0.3.5"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # build.rs stamps the version from `git describe`: tags needed.
          fetch-depth: 0

      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/espflash
            ~/.cargo/bin/ldproxy
            ~/.cargo/bin/espup
            ~/.rustup/toolchains/esp
            ~/export-esp.sh
          key: tools-espup${{ env.ESPUP_VERSION }}-esp${{ env.ESP_TOOLCHAIN }}-espflash${{ env.ESPFLASH_VERSION }}-ldproxy${{ env.LDPROXY_VERSION }}

      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          curl -fsSL -o ~/.cargo/bin/espup \
            "https://github.com/esp-rs/espup/releases/download/v${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu"
          chmod +x ~/.cargo/bin/espup
          espup install --targets esp32 --toolchain-version "$ESP_TOOLCHAIN"
          cargo install --locked "espflash@${ESPFLASH_VERSION}" "ldproxy@${LDPROXY_VERSION}"

      - name: Cache ESP-IDF and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            firmware/.embuild
            firmware/target
          key: build-${{ hashFiles('firmware/Cargo.lock', 'firmware/sdkconfig.defaults', 'firmware/.cargo/config.toml') }}
          restore-keys: build-

      - name: Test, build and make the images
        run: ./flash.sh --image

      - uses: actions/upload-artifact@v7
        with:
          name: power-monitor-${{ github.sha }}
          path: |
            power-monitor.bin
            power-monitor-full.bin

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Default firmware for an ESP32 with 4 MB flash: remote support off, battery divider from sheet 1.

          - **power-monitor-full.bin** — first flash of a new board: write at address `0x0` (erases settings).
          - **power-monitor.bin** — update of a working device: panel → «Прошивка».

          How to flash: see README, «Готова прошивка».
          EOF
          gh release create "$GITHUB_REF_NAME" power-monitor-full.bin power-monitor.bin \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
