<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="Аркуш 1: акумулятор до 80 вольт через запобіжник F1. Одразу за запобіжником дільник R1 330 кілоом і R2 10 кілоом з конденсатором C1 на вхід АЦП. Далі діод D1 і DC-DC JZ7015, налаштований на 5 вольт.">
