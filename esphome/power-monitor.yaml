# Монітор світла для Home Assistant: Wemos D1 mini (ESP8266), схема в hardware/README.md, варіант В.
# Передає в Home Assistant «світло є/немає» і напругу акумулятора.

substitutions:
  name: power-monitor
  friendly_name: Монітор світла
  # Дільник з аркуша 1, в омах. Найточніше — вписати виміряні мультиметром значення.
  r1: "330000"
  r2: "10000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: !secret power_monitor_api_key

ota:
  - platform: esphome
    password: !secret power_monitor_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Без Wi-Fi пристрій відкриває власну точку доступу для налаштування.
  ap:
    ssid: ${name}

captive_portal:

binary_sensor:
  - platform: gpio
    name: Світло
    device_class: power
    pin:
      number: D5
      # Поки є 220 В, оптопара тримає вхід у «0».
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 1s

sensor:
  - platform: adc
    pin: A0
    name: Напруга акумулятора
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      # Чип міряє 0…1 В за дільником плати 220k/100k, тож на піні A0 це 0…3.2 В.
      # До A0 іде R1, а R2 стоїть паралельно з дільником плати (220k + 100k).
      - lambda: |-
          const float board = 320000.0f;
          const float low = ${r2} * board / (${r2} + board);
          return x * 3.2f * (${r1} + low) / low;
      - sliding_window_moving_average:
          window_size: 30
          send_every: 30

  - platform: wifi_signal
    name: Сигнал Wi-Fi
    update_interval: 60s
