[package]
name = "power-monitor"
version = "0.1.0"
edition = "2021"
description = "ESP32 firmware: watches mains voltage and reports changes to Telegram"

[[bin]]
name = "power-monitor"
harness = false # no host tests here; the logic lives in power-core

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
embedded-svc = "0.29"
serde = "1"
serde_json = "1"
esp-idf-svc = "0.53"
power-core = { path = "../power-core" }
esp32-nimble = "0.13"

[build-dependencies]
power-core = { path = "../power-core" }
embuild = "0.33"
zopfli = "0.8.4"

# A fix to its client's MTU handling; see vendor/esp32-nimble/PATCHED.md.
[patch.crates-io]
esp32-nimble = { path = "vendor/esp32-nimble" }
