[package]
name = "remote-server"
version = "0.1.0"
edition = "2021"
description = "Remote support for power monitors: check-ins, sessions and a relay to each device's panel"

[dependencies]
power-core = { path = "../power-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
